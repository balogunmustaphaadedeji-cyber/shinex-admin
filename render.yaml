services:
  - type: web
    name: shinex-admin-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SHINEX_API_URL
        value: https://shinex-marketplace.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
