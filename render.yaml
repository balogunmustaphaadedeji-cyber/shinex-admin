# Render Static Site config for SHINEX Admin.
# Ensures client-side routes (e.g. /users, /products) don't 404 on
# refresh or direct load — every path falls back to index.html so
# react-router-dom can take over and render the right page.
services:
  - type: web
    name: shinex-admin
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://shinex-marketplace.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
